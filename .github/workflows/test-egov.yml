name: Тест на достъпа до data.egov.bg

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проба
        run: |
          echo "Изходящ IP: $(curl -s https://api.ipify.org)"
          python3 - <<'EOF'
          import json, time, urllib.request, urllib.error

          BASE = "https://data.egov.bg"
          DATASET = "57f1e2e7-b235-45e8-94c4-4d69f0b1a690"
          BROWSER = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0 Safari/537.36"

          def call(label, path, ua, body=None):
              data = json.dumps(body).encode() if body else None
              h = {"User-Agent": ua}
              if body:
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=h,
                                           method="POST" if body else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      code, text = r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  code, text = e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  code, text = "ГРЕШКА", str(e)
              print(f"{code}  {label}\n      {text[:300]!r}\n")
              time.sleep(2)
              return text

          print("Час (UTC):", time.strftime("%Y-%m-%d %H:%M:%S", time.gmtime()))
          crit = {"criteria": {"dataset_uri": DATASET}}
          call("Начална страница", "/", BROWSER)
          call("API без User-Agent", "/api/listResources", "", crit)
          t = call("API с браузърен User-Agent", "/api/listResources", BROWSER, crit)
          try:
              res = json.loads(t).get("resources") or []
              print("Ресурси в набора:", len(res))
              if res:
                  call("Данни от първия ресурс", "/api/getResourceData", BROWSER,
                       {"resource_uri": res[0]["uri"]})
          except Exception:
              print("Списъкът с ресурси не се прочете.")
          EOF
